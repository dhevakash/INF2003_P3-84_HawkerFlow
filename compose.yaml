services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root_local_only
      MARIADB_DATABASE: hawkerflow
      MARIADB_USER: hawkerflow
      MARIADB_PASSWORD: hawkerflow_dev
    volumes: [ "mariadb_data:/var/lib/mysql" ]
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 30
  mongo:
    image: mongo:8.0
    ports: [ "127.0.0.1:27017:27017" ]
    volumes: [ "mongo_data:/data/db" ]
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports: [ "127.0.0.1:8080:8000" ]
    environment:
      APP_ENV: development
      JWT_SECRET: ${JWT_SECRET:-local-demo-only-change-before-sharing-123456789}
      DATABASE_URL: mysql+pymysql://hawkerflow:hawkerflow_dev@mariadb:3306/hawkerflow
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: hawkerflow_current
    depends_on:
      mariadb: { condition: service_healthy }
      mongo: { condition: service_healthy }
volumes:
  mariadb_data:
  mongo_data:
